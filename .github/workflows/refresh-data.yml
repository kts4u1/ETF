# 데이터 자동 갱신: 평일 22:23 UTC(한국 시간 다음 날 07:23 — 미국·한국 장이 모두 끝난 뒤)에 sync 를 돌려
# 새로 상장한 ETF와 최신 시세를 반영하고, 의미 있게 바뀌었을 때만 기본 브랜치에 커밋한다.
# 기본 브랜치에 병합돼 있어야 스케줄이 동작한다. GitHub 서버에서 네이버·야후 접속이 막혀 있으면 이 작업이 실패로 표시된다
# (실패해도 아무것도 커밋하지 않는다). 수동 실행: Actions 탭 → Refresh data → Run workflow.
name: Refresh data

on:
  schedule:
    - cron: "23 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 데이터 갱신(sync → 테스트 → 빌드 → 변경 판정)
        id: refresh
        run: |
          set -o pipefail
          bash scripts/refresh-data.sh | tee refresh.log
          echo "result=$(grep -o 'REFRESH_RESULT=.*' refresh.log | tail -n 1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: 바뀐 데이터 커밋
        if: steps.refresh.outputs.result == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): 자동 갱신 $(date -u +%F)"
          git push
